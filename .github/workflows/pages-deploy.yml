# Publishes the FrontEND/ folder as the GitHub Pages website
# (https://drcjayawardena.github.io/VehicleHUB/) whenever a change to it reaches main.
# Needs: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Before publishing, scripts/build-vehicle-pages.js generates the SEO pages (FrontEND/v/*.html),
# sitemap.xml and robots.txt from the live showroom data. These files are NOT committed (.gitignore).
# The hourly refresh lives in vehicle-pages-refresh.yml, which calls this workflow.
name: Website — deploy (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'FrontEND/**'
      - 'scripts/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One Pages deployment at a time (job level, so it also works when called from another workflow).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Photos already downloaded from Drive are kept between runs, so each hourly run only fetches new ones.
      - uses: actions/cache@v4
        with:
          path: FrontEND/v/img
          key: vehicle-photos-${{ github.run_id }}
          restore-keys: vehicle-photos-

      # A failed build must not block a normal website update (push): the site then publishes without the
      # static vehicle pages and vehicles.html falls back to its pop-up. Scheduled / manual runs fail loudly.
      - name: Build vehicle pages, sitemap.xml, robots.txt
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-vehicle-pages.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FrontEND

      - id: deployment
        uses: actions/deploy-pages@v4
